<dialog
  #dialog
  class="dialog"
  (cancel)="onCancel($event)"
  (click)="onBackdropClick($event)"
  aria-labelledby="dialog-title"
>
    <div class="dialog-heading">
      <div class="dialog-icon" [class.danger]="destructive" aria-hidden="true">
        <span>{{ destructive ? "!" : "?" }}</span>
      </div>

      <div class="dialog-content">
        <h2 id="dialog-title">{{ title || ("common.confirmTitle" | translate) }}</h2>
        @if (messageHighlight && message.includes(messageHighlight)) {
          <p>
            {{ messageBeforeHighlight }}<strong class="dialog-highlight">{{ messageHighlight }}</strong>{{ messageAfterHighlight }}
          </p>
        } @else {
          <p>{{ message || ("common.confirmMessage" | translate) }}</p>
        }
      </div>
    </div>

    <div class="dialog-actions">
      <button type="button" class="cancel-button" (click)="cancelled.emit()">
        {{ cancelLabel || ("common.cancel" | translate) }}
      </button>
      <button
        type="button"
        class="confirm-button"
        [class.danger]="destructive"
        (click)="confirmed.emit()"
      >
        {{ confirmLabel || ("common.confirm" | translate) }}
      </button>
    </div>
</dialog>
