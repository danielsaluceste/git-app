<div
  class="app-shell"
  [class.main-sidebar-collapsed]="!mainSidebarOpen()"
  [class.repository-open]="!!activeRepository()"
>
  <app-sidebar
    [collapsed]="!mainSidebarOpen()"
    (toggleRequested)="closeMainSidebar()"
  />

  @if (activeRepository(); as repository) {
    <app-repository-sidebar [repository]="repository" />
  }

  <section class="workspace">
    <app-topbar
      [showMainSidebarButton]="!mainSidebarOpen()"
      (mainSidebarRequested)="openMainSidebar()"
    />

    <main class="content">
      <router-outlet />
    </main>
  </section>

  <app-toast-container />
</div>
