<div
  class="app-shell"
  [class.main-sidebar-collapsed]="!mainSidebarOpen()"
  [class.repository-open]="!!activeRepository()"
  [class.codex-open]="codexSidebarOpen()"
  [class.codex-resizing]="codexResizeActive()"
  [style.--codex-sidebar-width.px]="codexSidebarWidth()"
>
  <app-sidebar
    [collapsed]="!mainSidebarOpen()"
    (toggleRequested)="closeMainSidebar()"
  />

  @if (activeRepository(); as repository) {
    <app-repository-sidebar [repository]="repository" />
  }

  <section class="workspace">
    <app-topbar
      [showMainSidebarButton]="!mainSidebarOpen()"
      [showCodexButton]="!!activeRepository() && codexEnabled() && codexStatus()?.installed === true"
      [codexOpen]="codexSidebarOpen()"
      [showTerminalButton]="!!activeRepository()"
      [terminalOpen]="terminalDrawerOpen()"
      (mainSidebarRequested)="openMainSidebar()"
      (codexRequested)="toggleCodexSidebar()"
      (terminalRequested)="toggleTerminalDrawer()"
    />

    <app-repository-tabs />

    <main class="content">
      <router-outlet />
    </main>

    @if (activeRepository()) {
      <app-terminal-drawer />
    }
  </section>

  @if (activeRepository(); as repository) {
    @if (codexSidebarOpen()) {
      <div class="codex-resizable-panel">
        <div
          class="codex-resize-handle"
          role="separator"
          aria-orientation="vertical"
          aria-label="Redimensionar barra do Codex"
          (pointerdown)="startCodexResize($event)"
        ></div>
        <app-codex-sidebar
          [repository]="repository"
          (closeRequested)="closeCodexSidebar()"
        />
      </div>
    }
  }

  <app-toast-container />
</div>
