<header class="topbar" (mousedown)="startDragging($event)">
  @if (showMainSidebarButton) {
    <button
      type="button"
      class="main-sidebar-button"
      aria-label="Abrir menu principal"
      title="Abrir menu principal"
      (click)="mainSidebarRequested.emit()"
    >
      <svg class="sidebar-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="m6 3 5 5-5 5" />
      </svg>
    </button>
  }

  <div class="window-drag-region" data-tauri-drag-region aria-hidden="true"></div>

  <app-workspace-menu />

  <div class="topbar-actions">
    <div class="window-controls" aria-label="Controles da janela">
      <button
        type="button"
        class="window-control minimize"
        aria-label="Minimizar"
        title="Minimizar"
        (mousedown)="$event.stopPropagation()"
        (click)="minimize()"
      >
        <span aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="window-control maximize"
        aria-label="Maximizar ou restaurar"
        title="Maximizar ou restaurar"
        (mousedown)="$event.stopPropagation()"
        (click)="toggleMaximize()"
      >
        <span aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="window-control close"
        aria-label="Fechar"
        title="Fechar"
        (mousedown)="$event.stopPropagation()"
        (click)="close()"
      >
        <span aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
