<header class="topbar" (mousedown)="startDragging($event)">
  @if (showMainSidebarButton) {
    <button
      type="button"
      class="main-sidebar-button"
      [attr.aria-label]="'nav.open' | translate"
      [title]="'nav.open' | translate"
      (click)="mainSidebarRequested.emit()"
    >
      <svg class="sidebar-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="m6 3 5 5-5 5" />
      </svg>
    </button>
  }

  <div class="window-title" data-tauri-drag-region>
    <span class="brand-mark" data-tauri-drag-region>G</span>
    <span class="brand-name" data-tauri-drag-region>{{ "brand.name" | translate }}</span>
  </div>

  <app-workspace-menu />

  <div class="topbar-actions">
    @if (showCodexButton) {
      <button
        type="button"
        class="codex-launch-button"
        [class.is-active]="codexOpen"
        [attr.aria-label]="'codex.open' | translate"
        [title]="'codex.open' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="codexRequested.emit()"
      >
        <span aria-hidden="true">✦</span>
      </button>
    }

    <div class="window-controls" [attr.aria-label]="'window.controls' | translate">
      <button
        type="button"
        class="window-control minimize"
        [attr.aria-label]="'window.minimize' | translate"
        [title]="'window.minimize' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="minimize()"
      >
        <span aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="window-control maximize"
        [attr.aria-label]="'window.maximize' | translate"
        [title]="'window.maximize' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="toggleMaximize()"
      >
        <span aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="window-control close"
        [attr.aria-label]="'window.close' | translate"
        [title]="'window.close' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="close()"
      >
        <span aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
