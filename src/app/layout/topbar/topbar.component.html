<header class="topbar" (mousedown)="startDragging($event)" (dblclick)="toggleMaximize()">
  @if (showMainSidebarButton) {
    <button
      type="button"
      class="main-sidebar-button"
      [attr.aria-label]="'nav.open' | translate"
      [title]="'nav.open' | translate"
      (click)="mainSidebarRequested.emit()"
    >
      <svg class="sidebar-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="m6 3 5 5-5 5" />
      </svg>
  </button>
  }

  <div class="window-title">
    <img class="brand-wordmark brand-wordmark-dark" src="assets/gitluna-logo-dark.png" alt="GitLuna" />
    <img class="brand-wordmark brand-wordmark-light" src="assets/gitluna-logo.png" alt="" aria-hidden="true" />
  </div>

  <app-workspace-menu />

  <div class="topbar-actions">
    @if (updateAvailable) {
      <button
        type="button"
        class="update-launch-button"
        [attr.aria-label]="'updates.availableButton' | translate"
        [title]="'updates.availableButton' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="updateRequested.emit()"
      >
        <svg class="update-icon" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M15 9a6 6 0 1 1-1.76-4.24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M15 3.5v4h-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="update-dot" aria-hidden="true"></span>
      </button>
    }

    @if (showTerminalButton) {
      <button
        type="button"
        class="terminal-launch-button"
        [class.is-active]="terminalOpen"
        [attr.aria-label]="'terminal.toggle' | translate"
        [title]="'terminal.toggleTooltip' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="terminalRequested.emit()"
      >
        <svg class="terminal-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m4 5 3.5 3L4 11" />
          <path d="M9.5 11H13" />
        </svg>
      </button>
    }

    @if (showCodexButton) {
      <button
        type="button"
        class="codex-launch-button"
        [class.is-active]="codexOpen"
        [attr.aria-label]="'codex.open' | translate"
        [title]="'codex.open' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="codexRequested.emit()"
      >
        <span aria-hidden="true">✦</span>
      </button>
    }

    <div class="window-controls" [attr.aria-label]="'window.controls' | translate">
      <button
        type="button"
        class="window-control minimize"
        [attr.aria-label]="'window.minimize' | translate"
        [title]="'window.minimize' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="minimize()"
      >
        <span aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="window-control maximize"
        [attr.aria-label]="'window.maximize' | translate"
        [title]="'window.maximize' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="toggleMaximize()"
      >
        <span aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="window-control close"
        [attr.aria-label]="'window.close' | translate"
        [title]="'window.close' | translate"
        (mousedown)="$event.stopPropagation()"
        (click)="close()"
      >
        <span aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
