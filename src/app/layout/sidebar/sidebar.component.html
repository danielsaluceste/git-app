<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">G</span>
    <span class="brand-name">Git App</span>
    @if (!collapsed) {
      <button
        type="button"
        class="collapse-button"
        aria-label="Recolher menu principal"
        title="Recolher menu principal"
        (click)="toggleRequested.emit()"
      >
        ‹
      </button>
    }
  </div>

  <nav aria-label="Navegação principal">
    <a
      routerLink="/repositories"
      routerLinkActive="active"
      data-tooltip="Repositórios"
      (click)="closeCurrentRepository()"
    >
      <span class="nav-icon" aria-hidden="true">▣</span>
      <span class="nav-label">Repositórios</span>
    </a>
    <a
      routerLink="/integrations"
      routerLinkActive="active"
      data-tooltip="Integrações"
      (click)="closeCurrentRepository()"
    >
      <span class="nav-icon" aria-hidden="true">⇄</span>
      <span class="nav-label">Integrações</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a routerLink="/settings" routerLinkActive="active" data-tooltip="Configurações">
      <span class="nav-icon" aria-hidden="true">⚙</span>
      <span class="nav-label">Configurações</span>
    </a>
  </div>
</aside>
