<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">
      <svg class="brand-luna-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" />
        <circle cx="15" cy="8" r="2" fill="var(--app-bg, #111827)" />
        <circle cx="9" cy="14" r="1.6" fill="currentColor" />
        <path d="M15 10v1.8a2.2 2.2 0 0 1-2.2 2.2H10.6" stroke="var(--app-bg, #111827)" stroke-width="1.2" stroke-linecap="round" fill="none" />
      </svg>
    </span>
    <span class="brand-name">{{ "brand.name" | translate }}</span>
    @if (!collapsed) {
      <button
        type="button"
        class="collapse-button"
        [attr.aria-label]="'nav.collapse' | translate"
        [title]="'nav.collapse' | translate"
        (click)="toggleRequested.emit()"
      >
        <svg class="sidebar-toggle-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="m10 3-5 5 5 5" />
        </svg>
      </button>
    }
  </div>

  <nav [attr.aria-label]="'nav.main' | translate">
    <a
      routerLink="/repositories"
      routerLinkActive="active"
      [attr.data-tooltip]="'nav.repositories' | translate"
      (click)="closeCurrentRepository()"
    >
      <span class="nav-icon" aria-hidden="true">▣</span>
      <span class="nav-label">{{ "nav.repositories" | translate }}</span>
    </a>
    <a
      routerLink="/integrations"
      routerLinkActive="active"
      [attr.data-tooltip]="'nav.integrations' | translate"
      (click)="closeCurrentRepository()"
    >
      <span class="nav-icon" aria-hidden="true">⇄</span>
      <span class="nav-label">{{ "nav.integrations" | translate }}</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a
      routerLink="/settings"
      routerLinkActive="active"
      [attr.data-tooltip]="'nav.settings' | translate"
      (click)="closeCurrentRepository()"
    >
      <span class="nav-icon" aria-hidden="true">⚙</span>
      <span class="nav-label">{{ "nav.settings" | translate }}</span>
    </a>
  </div>
</aside>
