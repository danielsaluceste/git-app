[package]
name = "GitLuna"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "git_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = [] }
base64 = "0.22"
# Chromium Embedded Framework runtime (GTK 4 + Chromium, 144 Hz on high refresh displays)
tauri-runtime-cef = { version = "3.0.0-alpha.6", features = ["devtools"] }
tauri-plugin-dialog = { version = "3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "3.0.0-alpha.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1.1"
portable-pty = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
# Acesso direto ao X11/XWayland para o arrasto da janela e o WM_CLASS, que o
# runtime CEF (GTK4 + janela filha do Chromium) não consegue definir.
raw-window-handle = "0.6"
x11rb = "0.13"
# Workaround do GSource ocioso que o MessagePumpGlib do Chromium deixa no
# contexto GLib e que mantém a thread principal em 100% de CPU (winit-gtk4).
glib-sys = "0.22"
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
